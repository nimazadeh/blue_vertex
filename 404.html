<script>/* theme bootstrap - runs before CSS paint to avoid flash */
(function(){try{var q=(location.search.match(/[?&]theme=(light|dark)/i)||[])[1];var t=q||localStorage.getItem('bv-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<script>/* fonts under file:// — browsers block woff2 via CORS from origin null, so
  inline the variable font as a data URI (last @font-face wins for all weights) */
(function(){try{
  if(location.protocol==='file:'){
    var base=document.querySelector('link[rel="stylesheet"][href$="base.css"]');
    var l=document.createElement('link');l.rel='stylesheet';
    l.href=(base?base.getAttribute('href'):'assets/css/base.css').replace(/base\.css$/,'fonts-embed.css');
    document.head.appendChild(l);
  }
}catch(e){}})();</script>
